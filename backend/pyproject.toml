[project]
name = "pact"
version = "0.1.0"
description = "Settlement infrastructure for the agent economy, built on PayPal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
# Only needed when DATABASE_URL is set (serverless / multi-instance deployments).
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pact"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
