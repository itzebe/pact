name: CI

# Runs on every pull request into master and on pushes to the security branch.
# A push to master is covered transitively: master only receives commits through
# a reviewed pull request that already ran this workflow.
on:
  pull_request:
    branches: [master]
  push:
    branches:
      - security/pact-prelaunch-hardening
      - security/customer-auth-and-shared-stores
      - feat/paypal-webhooks-refund-reconciliation

# Least privilege: these jobs only read the repository. No job needs a token that
# can write, and none is given one.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref, so CI minutes are not
# spent on a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11 + PostgreSQL 16)
    runs-on: ubuntu-24.04
    # Postgres 16 is the version the tests are written against. The service
    # container is the only database the suite may use, and DATABASE_URL points at
    # it so the Postgres integration tests execute instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact
          POSTGRES_DB: pact
        ports:
          - 5432:5432
        # Fail the job rather than start the tests against a database that is not
        # yet accepting connections.
        options: >-
          --health-cmd "pg_isready -U pact -d pact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_VERSION: "3.11"
      # Matches the service container above. Not a secret: it is a throwaway
      # database that exists only for the duration of the job.
      DATABASE_URL: postgresql://pact:pact@localhost:5432/pact
      # The pooled (transaction-mode) endpoint PgBouncer provides. The settlement
      # lock must NOT use it; the tests assert that the direct endpoint is used.
      PGBOUNCER_URL: postgresql://pact:pact@127.0.0.1:6432/pact
      PACT_ENV: test
      PACT_ALLOW_MOCK_PAYPAL: "true"
      PACT_AUTH_SECRET: ci-only-signing-secret-not-used-anywhere-real
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]" pyflakes

      # A guard, not a convenience: if the database were unreachable the Postgres
      # tests would skip themselves and the suite would look green while the
      # cross-instance guarantees went unexercised. This fails the job instead.
      - name: Assert the database is reachable
        working-directory: backend
        run: python -c "import psycopg; psycopg.connect('$DATABASE_URL').close()"

      # PgBouncer in *transaction* mode, on port 6432, in front of the same
      # database. Production's DATABASE_URL is Neon's pooled endpoint, which is a
      # transaction-mode pooler; without one here the pooled-endpoint settlement
      # tests would skip and the very bug they exist for would go unexercised.
      - name: Start PgBouncer (transaction mode)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          # The package ships its own pgbouncer instance (md5 auth, no "pact" user)
          # and starts it on 6432. If it keeps that port our instance cannot bind and
          # the packaged one answers instead, rejecting the password. Stop it first.
          sudo systemctl stop pgbouncer 2>/dev/null || true
          sudo systemctl disable pgbouncer 2>/dev/null || true
          sudo pkill -x pgbouncer 2>/dev/null || true
          sleep 1
          # PgBouncer refuses to run as root, so run it as the runner user with a
          # config it owns. Only the package install needs sudo.
          PGB_DIR="$(mktemp -d)"
          printf '%s\n' '"pact" "pact"' > "$PGB_DIR/userlist.txt"
          cat > "$PGB_DIR/pgbouncer.ini" <<INI
          [databases]
          pact = host=127.0.0.1 port=5432 dbname=pact
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = plain
          auth_file = $PGB_DIR/userlist.txt
          pool_mode = transaction
          max_client_conn = 200
          default_pool_size = 10
          ignore_startup_parameters = extra_float_digits,options
          pidfile = $PGB_DIR/pgbouncer.pid
          logfile = $PGB_DIR/pgbouncer.log
          unix_socket_dir = $PGB_DIR
          INI
          pgbouncer -d "$PGB_DIR/pgbouncer.ini" || { cat "$PGB_DIR/pgbouncer.log"; exit 1; }
          for i in $(seq 1 20); do
            if python -c "import psycopg,sys; psycopg.connect('$PGBOUNCER_URL', connect_timeout=3).close()" 2>/dev/null; then
              echo "PgBouncer is accepting connections"; break
            fi
            sleep 1
          done
          if ! python -c "import psycopg; psycopg.connect('$PGBOUNCER_URL', connect_timeout=3).close()"; then
            echo "::error::PgBouncer did not accept a connection on the pooled endpoint"
            cat "$PGB_DIR/pgbouncer.log" || true
            exit 1
          fi
          echo "pooled endpoint reachable"

      - name: Run the backend test suite
        working-directory: backend
        run: python -m pytest tests/ -q

      # Prove the Postgres integration tests actually ran. ``test_postgres_store``,
      # ``test_ticket_store_postgres``, ``test_webhook_postgres``,
      # ``test_webhook_persistence``, ``test_pool``, ``test_auth_store``,
      # ``test_accounts``, ``test_email_dispatcher`` and ``test_settlement_pooling``
      # are the cross-instance safety net (settlement, SSE tickets, webhooks,
      # connection pooling, sessions and the email outbox); a skip means that net is
      # not deployed, which is a failure, not a pass. ``test_settlement_pooling``
      # needs PGBOUNCER_URL, which the step above provides.
      - name: Assert the PostgreSQL tests were not skipped
        working-directory: backend
        run: |
          python -m pytest tests/test_postgres_store.py tests/test_ticket_store_postgres.py \
            tests/test_webhook_postgres.py tests/test_webhook_persistence.py \
            tests/test_pool.py tests/test_auth_store.py tests/test_accounts.py \
            tests/test_email_dispatcher.py tests/test_settlement_pooling.py \
            tests/test_rate_limit_postgres.py \
            -q --no-header -rs > pg-tests.log 2>&1 || { cat pg-tests.log; exit 1; }
          cat pg-tests.log
          if grep -Eq "[0-9]+ skipped" pg-tests.log; then
            echo "::error::PostgreSQL integration tests were skipped; they must run in CI."
            exit 1
          fi

      - name: Lint with pyflakes
        working-directory: backend
        run: python -m pyflakes pact/ scripts/

      # The production incident this guards against: the root ``pyproject.toml``
      # (what Vercel's Python runtime installs from, via ``uv.lock``) silently drifted
      # from the real dependency set and omitted PyJWT. The image built fine and every
      # authenticated request then raised ModuleNotFoundError. A dependency declared in
      # one manifest but missing from another is a deployment break, so it fails here.
      - name: Assert the dependency manifests agree
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib

          def names_from_pyproject(path):
              data = tomllib.loads(pathlib.Path(path).read_text())
              deps = data.get("project", {}).get("dependencies", [])
              return {re.split(r"[<>=!\[; ]", spec)[0].strip().lower() for spec in deps}

          def names_from_requirements(path):
              out = set()
              for line in pathlib.Path(path).read_text().splitlines():
                  line = line.split("#", 1)[0].strip()
                  if line:
                      out.add(re.split(r"[<>=!\[; ]", line)[0].strip().lower())
              return out

          backend = names_from_pyproject("backend/pyproject.toml")
          root = names_from_pyproject("pyproject.toml")
          reqs = names_from_requirements("requirements.txt")

          # uvicorn is a runtime server dependency the Vercel function does not need
          # (Vercel provides its own server), so it is expected only in the Docker
          # requirements file and the backend manifest.
          backend_runtime = backend - {"uvicorn"}
          missing_root = backend_runtime - root
          missing_reqs = backend_runtime - reqs
          if missing_root:
              sys.exit(f"root pyproject.toml is missing runtime deps: {sorted(missing_root)}")
          if missing_reqs:
              sys.exit(f"requirements.txt is missing runtime deps: {sorted(missing_reqs)}")
          print(f"manifests agree on {len(backend_runtime)} runtime dependencies")
          PY

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: "20"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Install from the committed lockfile, so a build is reproducible and a
          # dependency bump cannot slip in unnoticed.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build the production bundle
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker (production image)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Builds the actual Dockerfile — the same image the deployment runs — with
      # the repository's own build cache. It is never pushed and no registry
      # credentials are used.
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pact:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build only proves the layers built. This proves the image is a
      # working application: it must start and answer its own health check.
      - name: Verify the image starts and serves /api/health
        run: |
          docker run -d --name pact-ci \
            -e PACT_ENV=test \
            -e PACT_ALLOW_MOCK_PAYPAL=true \
            -e PACT_AUTH_SECRET=ci-only-signing-secret-not-used-anywhere-real \
            -e PACT_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -p 8000:8000 pact:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              echo "health check passed"
              curl -fsS http://127.0.0.1:8000/api/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container did not become healthy in time"
          docker logs pact-ci
          exit 1
