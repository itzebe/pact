# One service serves both the API and the built UI, so the hosted demo is a
# single URL that a judge can open and use immediately.
services:
  - type: web
    name: pact
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: pact-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PACT_ENV
        value: development
      # Required. Generate a value and set it here (or as a secret). Without it the
      # API fails closed and refuses every protected request.
      - key: PACT_AUTH_SECRET
        generateValue: true
      - key: PACT_ALLOWED_HOSTS
        fromService:
          type: web
          name: pact
          property: host
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: PACT_DATA_DIR
        value: /data
      - key: PACT_CURRENCY
        value: USD
      # The demo runs without PayPal credentials by default so a visitor can still
      # see the full lifecycle. It is labelled "Simulated PayPal" everywhere, and
      # PACT_ENV=development is what permits the mock. Add real credentials (and
      # drop this) to settle for real.
      - key: PACT_ALLOW_MOCK_PAYPAL
        value: "true"
