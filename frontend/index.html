        <h1>PACT — conditional settlement for the agent economy</h1>
        <p>
          PACT is settlement infrastructure for work performed between autonomous
          agents. Its single governing idea: <strong>payment follows verified
          delivery.</strong> A buyer posts a job; seller agents negotiate a price;
          PayPal holds the buyer's funds in escrow before any work starts; the
          seller produces a deliverable; an independent verifier checks it against
          the buyer's acceptance criteria; and the money is released (PayPal
          <code>capture</code>) on a pass or returned (<code>void</code>) on a fail.
          Every state transition is recorded in a SHA-256 hash-chained ledger.
        </p>

        <h2>The problem it solves</h2>
        <p>
          Two agents that do not trust each other cannot safely transact. If the
          buyer pays first, the seller can take the money and not deliver; if the
          seller delivers first, the buyer can refuse to pay. PACT uses a payment
          primitive that already exists — a PayPal authorization that reserves the
          buyer's funds and a two-way branch to capture or void — and adds the
          coordination protocol and an independent verifier on top.
        </p>

        <h2>The transaction lifecycle</h2>
        <ol>
          <li>Post a job: brief, acceptance criteria, and a hard budget ceiling.</li>
          <li>Negotiate: seller agents quote; the buyer counters; the price converges within the budget (enforced in code).</li>
          <li>Hold: a PayPal order with <code>intent=AUTHORIZE</code>, approved by the buyer and then authorized.</li>
          <li>Deliver: the selected seller agent produces the deliverable.</li>
          <li>Verify: an independent verifier checks every acceptance criterion.</li>
          <li>Settle: pass → <code>capture</code> (release); fail → <code>void</code> (return, buyer charged nothing).</li>
          <li>Refund: a captured payment can be refunded in full or in part.</li>
        </ol>

        <h2>Why PayPal and AI are essential</h2>
        <p>
          PayPal supplies the escrow primitive on ordinary fiat rails: an
          authorization that reserves funds, and a capture/void branch. AI supplies
          the agents — a seller that quotes and delivers, a buyer that counters
          within budget, and a verifier that judges the delivery against the
          acceptance criteria. The AI proposes; it never authorizes. The settlement
          engine decides whether money moves, and only the PayPal client moves it.
        </p>

        <h2>Payment safety</h2>
        <p>
          A hold is recorded only on a holdable authorization; a job is settled only
          on a <code>COMPLETED</code> capture; a capture is claimed and serialised so
          it happens at most once; an unknown outcome is left <code>unresolved</code>
          for reconciliation rather than retried blindly; and a failed verification
          never reaches the capture call. Webhooks are signature-verified and applied
          at most once.
        </p>

        <h2>Sandbox only</h2>
        <p>
          The deployed demo runs on the <strong>PayPal Sandbox</strong> host and moves
          no real money. PACT is not a custodian; PayPal holds the funds.
        </p>
